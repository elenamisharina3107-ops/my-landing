# ─────────────────────────────────────────────────────────────────────
#  СПИСОК ПОЛЕЙ САЙТА («схема»)
#  Для нового сайта переписывается только этот файл.
#  Порядок разделов и полей здесь = порядок в панели.
# ─────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: OWNER/REPO            # подставляется при заведении сайта
  branch: main
  # Логин клиента идёт через наш вход, маскирующий GitHub:
  base_url: /admin/_panel
  auth_endpoint: auth

# Локальная разработка: Sveltia открывает папку проекта напрямую
# (Chrome/Edge, File System Access API), прокси-сервер не нужен.
local_backend: true

# Язык интерфейса панели
locale: ru

# Картинки: клиент грузит оригинал сюда, робот сжимает при сборке
media_folder: src/uploads
public_folder: /uploads

collections:
  # ── Одиночные блоки (file collections) ──────────────────────────────
  - name: singletons
    label: Блоки главной страницы
    files:
      - name: hero
        label: Первый экран
        file: src/_data/hero.json
        fields:
          - { name: title, label: Заголовок, widget: string, hint: Главная строка на первом экране }
          - { name: subtitle, label: Подзаголовок, widget: text, hint: Короткое пояснение под заголовком }
          - { name: image, label: Картинка, widget: image, hint: Большое фото справа }
          - { name: imageAlt, label: Описание картинки, widget: string, hint: Для незрячих и поисковиков }
          - { name: showButton, label: Показывать кнопку, widget: boolean, default: true }
          - { name: buttonText, label: Текст кнопки, widget: string, required: false }

      - name: settings
        label: Общие настройки
        file: src/_data/settings.json
        fields:
          - { name: phone, label: Телефон, widget: string }
          - { name: email, label: Почта, widget: string }
          - { name: address, label: Адрес, widget: string }
          - { name: hours, label: Часы работы, widget: string }
          - name: socials
            label: Соцсети
            widget: list
            fields:
              - { name: label, label: Название, widget: string }
              - { name: url, label: Ссылка, widget: string }
          - { name: footer, label: Подпись в подвале, widget: string }

      - name: seo
        label: SEO (текст для поисковиков)
        file: src/_data/seo.json
        fields:
          - { name: title, label: Заголовок вкладки, widget: string }
          - { name: description, label: Описание для поиска, widget: text }
          - { name: ogImage, label: Картинка для ссылок, widget: image, required: false }

  # ── Списки (folder collections) ────────────────────────────────────
  - name: services
    label: Услуги
    label_singular: Услуга
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Название", widget: string }
      - { name: price, label: "Цена, ₽", widget: number, value_type: int, min: 0 }
      - { name: oldPrice, label: "Старая цена, ₽", widget: number, value_type: int, required: false }
      - { name: order, label: "Порядок", widget: number, value_type: int, hint: "Чем меньше число, тем выше в списке" }
      - { name: body, label: "Описание", widget: markdown }
