<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>История изменений</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem clamp(1rem, 4vw, 3rem);
      background: #f6f7f8;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1b2530;
    }
    h1 { font-size: 1.4rem; margin: 0 0 1.2rem; }
    .nav { margin-bottom: 1.4rem; font-size: .9rem; }
    .nav a { color: #1f5049; margin-right: 1rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e0e4e8; border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: .7em 1em; border-bottom: 1px solid #e0e4e8; font-size: .92rem; vertical-align: top; }
    thead th { background: #eef1f3; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: #6a7783; }
    tbody tr:last-child td { border-bottom: 0; }
    code { font-family: ui-monospace, monospace; font-size: .85em; color: #6a7783; }
    button {
      padding: .4em .9em;
      background: #2c6e64;
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: .85rem;
      cursor: pointer;
    }
    .message { background: #e6f0ee; border: 1px solid #2c6e64; color: #1f5049; border-radius: 8px; padding: .6em .9em; margin-bottom: 1rem; font-size: .9rem; }
    .error { background: #f5ebda; border: 1px solid #8f5d13; color: #714a0f; border-radius: 8px; padding: .6em .9em; margin-bottom: 1rem; font-size: .9rem; }
    .empty { color: #6a7783; }
  </style>
</head>
<body>
  <p class="nav"><a href="/admin/_panel/">← С чего начать</a><a href="/admin/">Редактор</a><a href="/admin/_panel/export">Экспорт контента</a><a href="/admin/_panel/account">Сменить пароль</a></p>
  <h1>История изменений</h1>
  {{MESSAGE_BLOCK}}
  {{ROWS}}
</body>
</html>
