<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Смена пароля</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7f8;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1b2530;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e0e4e8;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(20,30,40,.06);
    }
    h1 { font-size: 1.3rem; margin: 0 0 .4rem; }
    .hint { color: #6a7783; font-size: .88rem; margin: 0 0 1.4rem; }
    label { display: block; font-size: .85rem; color: #41505d; margin: 0 0 .3rem; }
    input {
      width: 100%;
      padding: .6em .7em;
      border: 1px solid #c9d0d7;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: .7em;
      background: #2c6e64;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      background: #f5ebda;
      border: 1px solid #8f5d13;
      color: #714a0f;
      border-radius: 8px;
      padding: .6em .8em;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    .success {
      background: #e6f0ee;
      border: 1px solid #2c6e64;
      color: #1f5049;
      border-radius: 8px;
      padding: .6em .8em;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ACTION}}">
    <h1>Смена пароля</h1>
    <p class="hint">Вы вошли как {{EMAIL}}. Новый пароль — не короче 8 символов.</p>
    {{MESSAGE_BLOCK}}
    <label for="password">Новый пароль</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">Повторите пароль</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Сохранить</button>
  </form>
</body>
</html>
