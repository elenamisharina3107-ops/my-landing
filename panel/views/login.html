<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Вход в панель управления</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7f8;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1b2530;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border: 1px solid #e0e4e8;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(20,30,40,.06);
    }
    h1 { font-size: 1.3rem; margin: 0 0 1.4rem; }
    label { display: block; font-size: .85rem; color: #41505d; margin: 0 0 .3rem; }
    input {
      width: 100%;
      padding: .6em .7em;
      border: 1px solid #c9d0d7;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: .7em;
      background: #2c6e64;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      background: #f5ebda;
      border: 1px solid #8f5d13;
      color: #714a0f;
      border-radius: 8px;
      padding: .6em .8em;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="{{ACTION}}">
    <h1>Вход в панель управления</h1>
    {{ERROR_BLOCK}}
    <label for="email">Почта</label>
    <input id="email" name="email" type="email" autocomplete="username" value="{{EMAIL}}" required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
</body>
</html>
